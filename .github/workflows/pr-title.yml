name: PR title

# PRs are squash-merged, so the PR title becomes the commit message on main.
# Enforce Conventional Commits: feat(studio): add photo cropping
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  # Safe with pull_request_target: no checkout, only reads the PR title.
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            content
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" should start with a lowercase letter,
            e.g. "feat(studio): add photo cropping".
