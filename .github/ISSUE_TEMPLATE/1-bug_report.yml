name: 🐛 Bug report
description: Something in the museum or Studio is broken.
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /studio
        2. Upload a PNG
        3. Click Generate
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Galleries / floors,
          Learn pages,
          Studio / generation,
          Exhibition requests,
          Setup / build,
          Other,
        ]
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Image provider
      description: If generation is involved. Never paste API keys.
      placeholder: mock, openai, google, bfl, qwen…
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Chrome 140 on macOS / Node 22 / commit abc1234"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
